# Ticarvo single-address layout (ADR-011, K-26): the frontend at /, the API at /api, one origin, so no CORS
# and the session cookie works as is. Example only; adjust server_name, certificates and paths.
#
# The backend must be reachable only from this proxy (bind it to 127.0.0.1 or a private Docker network) and
# TRUSTED_PROXIES must match the address Nginx connects from:
#   backend on the host              -> default (127.0.0.1 and ::1)
#   backend in Docker, Nginx on host -> e.g. TRUSTED_PROXIES=172\.17\.0\.1 (the bridge gateway)
# Tomcat then takes the client IP from X-Forwarded-For only for requests from that address (SEC-M1-002).

server {
    listen 80;
    server_name ticarvo.example;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name ticarvo.example;
    ssl_certificate     /etc/letsencrypt/live/ticarvo.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ticarvo.example/privkey.pem;

    # Product images and logos are capped at 5 MB by the backend; the multipart envelope needs a little more.
    client_max_body_size 6m;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        # Overwrite, never append: whatever the client sent in this header is discarded.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # B-06: the same id in the proxy log and the application log.
        proxy_set_header X-Request-Id $request_id;
    }

    location = /actuator/health {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:8080;
    }

    # The frontend container (TicarvoFrontend Dockerfile) on 127.0.0.1:8081; it serves the SPA and its fallback.
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
    }
}
