spring.application.name=ticarvo-backend
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.session.timeout=30m
spring.session.jdbc.initialize-schema=never
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.mvc.problemdetails.enabled=true
server.port=${PORT:8080}
server.forward-headers-strategy=none
server.servlet.session.cookie.name=TICARVO_SESSION
server.servlet.session.cookie.path=/
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.tomcat.max-http-form-post-size=16KB
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
ticarvo.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
# ADR-011: new companies sell only after a platform admin verifies them.
ticarvo.sellers.verification-required=${SELLER_VERIFICATION_REQUIRED:true}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
